name: Release Please

on:
  push:
    branches: [main] # updates/opens the release PR when commits land on main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      release_version: ${{ steps.rp.outputs.version }}
    steps:
      # Only the upstream repo has this GitHub App configured. Forks fall
      # back to the default GITHUB_TOKEN below.
      - id: app-token
        if: ${{ secrets.GH_STOAT_RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_STOAT_RELEASE_APP_ID }}
          private-key: ${{ secrets.GH_STOAT_RELEASE_APP_PRIVATE_KEY }}
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json

  publish-release:
    name: Publish App
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      # Scoped to macOS + Windows on this fork: the Linux path (Flatpak +
      # AppImage, further below) hasn't been exercised here and is dropped
      # along with the build-appimage/publish-appimage jobs that depended
      # on it.
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout assets
        run: git -c submodule."assets".update=checkout submodule update --init assets

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # TODO: Figure out why 26 isn't working
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm ci

      - name: Publish
        run: |
          pnpm run publish
        env:
          PLATFORM: ${{ matrix.os }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
